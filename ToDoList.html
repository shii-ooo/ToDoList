<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoリスト</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #F3F1EC;
            display: flex;
            justify-content: center;
            padding: 32px 16px;
            font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
        }

        .sheet {
            width: 100%;
            max-width: 480px;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 4px;
            letter-spacing: 0.24px;
        }

        .rest {
            color: #6B6F63;
            font-size: 14.4px;
        }

        #count {
            color: #33492F;
            margin: 5px;
        }

        input {
            border-radius: 10px;
            font-size: 15.2px;
            font-family: inherit;
        }

        input[type="text"] {
            flex: 1;
            border: 1.5px solid #dad6c8;
            padding: 12px 14px;
        }

        input[type="submit"] {
            background: #33492F;
            color: #fff;
            border: none;
            padding: 0 18px;
            font-weight: 700;
            cursor: pointer;
        }

        form {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }

        .tabs {
            border-bottom: 1.5px solid #DAD6C8;
            margin-bottom: 14px;
        }

        .filter {
            background: none;
            border: none;
            padding: 8px 12px;
            color: #6B6F63;
            font-size: 14.08px;
            cursor: pointer;
        }

        .tabs button.active {
            color: #33492F;
            border-bottom: solid #33492F;
            font-weight: 700;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background-color: #ffff;
            border: 1.5px solid #dad6c8;
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            gap: 10px;
            color: #6B6F63;
        }

        .del {
            background: none;
            border: none;
            margin-left: auto;
            color: #C6603F;
            font-size: 19.2px;
            cursor: pointer;
        }

        .toggle {
            width: 20px;
            height: 20px;
            flex: none;
            border-radius: 6px;
            border: 1.5px solid #4B6B4A;
            margin-top: 2px;
            background-color: #4B6B4A;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            cursor: pointer;
        }

        .doneText {
            text-decoration: line-through;
        }

        #error {
            color: #C6603F;
        }
    </style>
</head>

<body>
    <div class="sheet">

        <header>
            <h1>しごとリスト</h1>
            <p class="rest">残り<span id="count">0</span>件</p>
        </header>

        <p id="error"></p>

        <form id="form">
            <input type="text" placeholder="やることを入力・・・">
            <input type="submit" value="追加">
        </form>

        <div class="tabs">
            <button class="filter">すべて</button>
            <button class="filter">未完了</button>
            <button class="filter">完了</button>
        </div>

        <ul id="list"></ul>
    </div>

    <script>
        const form = document.getElementById("form");
        const list = document.getElementById("list");
        const buttons = document.querySelectorAll(".filter");
        const count = document.getElementById("count");
        const error = document.getElementById("error");

        let tasks = [];
        let currentFilter = "すべて";

        const data = localStorage.getItem("tasks"); //localStrageのデータを文字列として取得
        if (data) {
            tasks = JSON.parse(data);
        }
        //Javaではできないが、JavaSciptだとnullならfalse、値あればtrue
        render();
        updateCount();

        //未完了の処理が何件か数える処理
        function updateCount() {
            const remainingTasks = tasks.filter(function (task) {
                return !task.done;
            })
            count.textContent = remainingTasks.length;
        }

        function update() {
            render();
            updateCount();

            localStorage.setItem("tasks", JSON.stringify(tasks));
            // JSON.stringify(tasks); 配列 → 文字列
            // JSON.parse(data);      文字列 → 配列　にして”tasks”としてlocalStrageに保存する
        }

        function render() {

            list.innerHTML = "";
            /*
            innerHTMLは「そのHTMLタグの中身」を見る・変更するためのもの
            <ul id="list">
                <li>掃除</li>
                <li>買い物</li>
            </ul>
            が
            <ul id="list">
            </ul>
            */

            tasks.forEach(function (task) {
                const li = document.createElement("li");

                //フィルターで未完了を選択したまま追加したときにHTMLにCSSを保持する
                if (currentFilter === "未完了" && task.done) {
                    li.style.display = "none";
                } else if (currentFilter === "完了" && !task.done) {
                    li.style.display = "none";
                } else {
                    li.style.display = "";
                }

                if (task.done) {
                    li.classList.add("done");
                }

                li.dataset.id = task.id;
                //li.dataset.idは画面に表示されている<li>に番号を覚えさせるためのもの
                //<li data-id="12345">掃除</li>みたいになる

                const text = document.createElement("span");
                text.textContent = task.text;

                if (task.done) {
                    text.classList.add("doneText");
                }

                const doneButton = document.createElement("button"); //HTMLに<button>を追加
                doneButton.textContent = "✓"; //<button></button>が<button>完了</button>になる
                doneButton.classList.add("toggle");

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "×";
                deleteButton.classList.add("del");

                doneButton.addEventListener("click", function () {

                    const task = tasks.find(function (task) {
                        return Number(li.dataset.id) === task.id;
                    })
                    task.done = !task.done;

                    // li.classList.toggle("done"); //<li>買い物</li>が<li class="done">買い物</li>になる

                    update();

                })

                deleteButton.addEventListener("click", function () {

                    tasks = tasks.filter(function (task) {
                        return Number(li.dataset.id) !== task.id;
                    })
                    //filter()→その一個を除いて残す 配列を返す
                    // filterはtrueになったものを残して、新しい配列を作るメソッド

                    // li.remove(); //消える

                    update();

                })

                li.appendChild(doneButton);//liの間に<button>を挿入
                li.appendChild(text);//文字をつくってliについか
                li.appendChild(deleteButton);
                list.appendChild(li);//<ul id="list"></ul>の間に<li>を挿入

            })



        }

        //追加を押したら走る処理
        form.addEventListener("submit", function (event) {
            //対象.addEventListener("何か起きたら", 処理)なので
            //fromがsubmitされたら、eventを実行してくださいということ
            event.preventDefault();
            //ブラウザが最初から用意している通常の動きを止める（submitなので送信更新しないでねってこと）

            const input = form.querySelector("input[type='text']");//条件に合う最初の一個を取得する
            //document.querySelector("p")だと、HTMLのなかから、最初の<p>を探す
            //form.querySelector("input[type='text']")なら、fromの中からinputのtype,textを探す

            //もし何も入力されなければ追加しない
            if (input.value === "") {
                error.textContent = "入力してください";
                return;
            }
            error.textContent = "";

            tasks.push({
                id: Date.now(),
                text: input.value,
                done: false
            });  //push()は配列の最後にデータを追加するメソッド

            update();

            input.value = "";

        })

        //未完了、完了、すべてをボタンにより表示させる処理
        buttons.forEach(function (button) {
            button.addEventListener("click", function () {
                console.log(button.textContent);
                currentFilter = button.textContent;

                buttons.forEach(function (button) {
                    button.classList.remove("active");
                });

                button.classList.add("active");

                const items = list.querySelectorAll("li");

                items.forEach(function (item) {
                    if (button.textContent === "未完了") {
                        if (item.classList.contains("done")) {
                            item.style.display = "none";
                        } else {
                            item.style.display = "";
                        }
                    }

                    if (button.textContent === "完了") {
                        if (item.classList.contains("done")) {
                            item.style.display = "";
                        } else {
                            item.style.display = "none";
                        }
                    }

                    if (button.textContent === "すべて") {
                        item.style.display = "";
                    }
                })
            })
        })

    </script>
</body>

</html>
