<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoリスト</title>
    <style>
        .done {
            text-decoration: line-through;
        }
    </style>
</head>

<body>
    <header>
        <h1>しごとリスト</h1>
        <p>残り<span id="count">0</span>件</p>
    </header>

    <form id="form">
        <input type="text" placeholder="やることを入力・・・">
        <input type="submit" value="追加">
    </form>

    <button class="filter">すべて</button>
    <button class="filter">未完了</button>
    <button class="filter">完了</button>

    <ul id="list"></ul>

    <script>
        const form = document.getElementById("form");
        const list = document.getElementById("list");
        const buttons = document.querySelectorAll(".filter");
        const count = document.getElementById("count");

        let tasks = [];

        //　ストレージにあるデータをtasks[]に追加
        const data = localStorage.getItem("tasks");
        if (data) {
            tasks = JSON.parse(data);
        }
        render();
        updateCount();

        // 残り何件か数える
        function updateCount() {
            const remainingTasks = tasks.filter(function (task) {
                return !task.done;
            })
            count.textContent = remainingTasks.length;
        }

        function update() {
            render();
            updateCount();
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

        // HRMLを追加する
        function render() {

            list.innerHTML = "";
            tasks.forEach(function (task) {
                const li = document.createElement("li");
                li.textContent = task.text;

                if (task.done) {
                    li.classList.add("done");
                }

                li.dataset.id = task.id;

                const doneButton = document.createElement("button");
                doneButton.textContent = "完了";

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "削除";

                doneButton.addEventListener("click", function () {

                    const task = tasks.find(function (task) {
                        return Number(li.dataset.id) === task.id;
                    })
                    task.done = !task.done;

                    update();

                })

                deleteButton.addEventListener("click", function () {

                    tasks = tasks.filter(function (task) {
                        return Number(li.dataset.id) !== task.id;
                    })

                    update();

                })

                li.appendChild(doneButton);
                li.appendChild(deleteButton);
                list.appendChild(li);

            })



        }

        //追加を押したら走る処理
        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const input = form.querySelector("input[type='text']");

            tasks.push({
                id: Date.now(),
                text: input.value,
                done: false
            });

            update();

            input.value = "";

        })

        //未完了、完了、すべてをボタンにより表示させる処理
        buttons.forEach(function (button) {
            button.addEventListener("click", function () {
                console.log(button.textContent);

                const items = list.querySelectorAll("li");

                items.forEach(function (item) {
                    if (button.textContent === "未完了") {
                        if (item.classList.contains("done")) {
                            item.style.display = "none";
                        } else {
                            item.style.display = "";
                        }
                    }

                    if (button.textContent === "完了") {
                        if (item.classList.contains("done")) {
                            item.style.display = "";
                        } else {
                            item.style.display = "none";
                        }
                    }

                    if (button.textContent === "すべて") {
                        item.style.display = "";
                    }
                })
            })
        })

    </script>
</body>

</html>
